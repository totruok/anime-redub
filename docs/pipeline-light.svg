<svg xmlns="http://www.w3.org/2000/svg" width="960" height="548" viewBox="0 0 960 548" role="img" aria-labelledby="title">
<title id="title">The anime-redub pipeline, from source video to finished dub</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#818b98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="redo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#178a6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="16" y="16" width="296" height="456" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="32" y="44" fill="#1f2328" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Prepare</text>
<rect x="32" y="60" width="264" height="68" rx="8" fill="#ffffff" stroke="#afb8c1"/>
<text x="46" y="82" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">One launch</text>
<text x="46" y="100" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">a source video, a language, a budget</text>
<text x="46" y="117" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">--language es --budget 3</text>
<text x="284" y="117" fill="#afb8c1" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">INPUT</text>
<path d="M164 128 V140" stroke="#818b98" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<rect x="32" y="142" width="264" height="68" rx="8" fill="#eef2f6" stroke="#6e7781"/>
<text x="46" y="164" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Separate voice from music</text>
<text x="46" y="182" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">BS-Roformer, on your machine</text>
<text x="46" y="199" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">stems/</text>
<text x="284" y="199" fill="#6e7781" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">SCRIPT</text>
<path d="M164 210 V222" stroke="#818b98" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<rect x="32" y="224" width="264" height="68" rx="8" fill="#f3efff" stroke="#8250df"/>
<text x="46" y="246" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Draft the scene</text>
<text x="46" y="264" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">who speaks, when, and where</text>
<text x="46" y="281" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">scene.json</text>
<text x="284" y="281" fill="#8250df" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">CLAUDE</text>
<path d="M164 292 V304" stroke="#818b98" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<rect x="32" y="306" width="264" height="68" rx="8" fill="#eef2f6" stroke="#6e7781"/>
<text x="46" y="328" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Measure the original</text>
<text x="46" y="346" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">phrases, talk time, level, pitch</text>
<text x="46" y="363" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">measure.json</text>
<text x="284" y="363" fill="#6e7781" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">SCRIPT</text>
<path d="M164 374 V386" stroke="#818b98" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<rect x="32" y="388" width="264" height="68" rx="8" fill="#f3efff" stroke="#8250df"/>
<text x="46" y="410" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Translate to fit</text>
<text x="46" y="428" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">target language, sized to each phrase</text>
<text x="46" y="445" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">scene.json</text>
<text x="284" y="445" fill="#8250df" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">CLAUDE</text>
<rect x="332" y="16" width="296" height="456" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="348" y="44" fill="#1f2328" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Perform</text>
<rect x="348" y="60" width="264" height="68" rx="8" fill="#fff0ea" stroke="#cf5a30"/>
<text x="362" y="82" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Design the voices</text>
<text x="362" y="100" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Voice Design, three takes each</text>
<text x="362" y="117" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">--language es</text>
<text x="600" y="117" fill="#cf5a30" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">PAID</text>
<path d="M480 128 V140" stroke="#818b98" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<rect x="348" y="142" width="264" height="68" rx="8" fill="#eef2f6" stroke="#6e7781"/>
<text x="362" y="164" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Choose the voices</text>
<text x="362" y="182" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">most distinct takes, or by ear if you ask</text>
<text x="362" y="199" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">cast.json</text>
<text x="600" y="199" fill="#6e7781" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">SCRIPT</text>
<path d="M480 210 V222" stroke="#818b98" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<rect x="348" y="224" width="264" height="68" rx="8" fill="#f3efff" stroke="#8250df"/>
<text x="362" y="246" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Add emotion tags</text>
<text x="362" y="264" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">from the original actor's delivery</text>
<text x="362" y="281" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">[shouts] [weary]</text>
<text x="600" y="281" fill="#8250df" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">CLAUDE</text>
<path d="M480 292 V304" stroke="#818b98" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<rect x="348" y="306" width="264" height="68" rx="8" fill="#fff0ea" stroke="#cf5a30"/>
<text x="362" y="328" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Generate the dialogue</text>
<text x="362" y="346" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Text to Dialogue v4, block by block</text>
<text x="362" y="363" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">--language es</text>
<text x="600" y="363" fill="#cf5a30" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">PAID</text>
<path d="M480 374 V386" stroke="#818b98" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<rect x="348" y="388" width="264" height="68" rx="8" fill="#fff0ea" stroke="#cf5a30"/>
<text x="362" y="410" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Cut into takes</text>
<text x="362" y="428" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Scribe finds where each line was said</text>
<text x="362" y="445" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">takes/</text>
<text x="600" y="445" fill="#cf5a30" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">PAID</text>
<rect x="648" y="16" width="296" height="456" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="664" y="44" fill="#1f2328" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Fit and mix</text>
<rect x="664" y="60" width="264" height="68" rx="8" fill="#eef2f6" stroke="#6e7781"/>
<text x="678" y="82" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Fit to the original</text>
<text x="678" y="100" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">up to 1.22x; lines still over are redone</text>
<text x="678" y="117" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">fit.json</text>
<text x="916" y="117" fill="#6e7781" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">SCRIPT</text>
<path d="M796 128 V140" stroke="#818b98" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<rect x="664" y="142" width="264" height="68" rx="8" fill="#eef2f6" stroke="#6e7781"/>
<text x="678" y="164" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Process and mix</text>
<text x="678" y="182" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">original voice -14 dB, music -5 dB</text>
<text x="678" y="199" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">out/dub_mix.wav</text>
<text x="916" y="199" fill="#6e7781" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">SCRIPT</text>
<path d="M796 210 V222" stroke="#818b98" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<rect x="664" y="224" width="264" height="68" rx="8" fill="#eef2f6" stroke="#6e7781"/>
<text x="678" y="246" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Check the levels</text>
<text x="678" y="264" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">finds parts that sink into the music</text>
<text x="678" y="281" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">check_levels.py</text>
<text x="916" y="281" fill="#6e7781" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">SCRIPT</text>
<path d="M796 292 V304" stroke="#818b98" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<rect x="664" y="306" width="264" height="68" rx="8" fill="#eef2f6" stroke="#6e7781"/>
<text x="678" y="328" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Render</text>
<text x="678" y="346" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">-18 LUFS, plus a timing check</text>
<text x="678" y="363" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">dub.mp4</text>
<text x="916" y="363" fill="#6e7781" font-size="10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" text-anchor="end">SCRIPT</text>
<path d="M796 374 V386" stroke="#818b98" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
<rect x="664" y="388" width="264" height="68" rx="8" fill="#e3f6f0" stroke="#178a6b"/>
<text x="678" y="410" fill="#1f2328" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600">Listen, if you want</text>
<text x="678" y="428" fill="#59636e" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">the report says where to listen</text>
<text x="678" y="445" fill="#59636e" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">optional</text>
